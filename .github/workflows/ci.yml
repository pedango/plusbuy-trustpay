name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plusbuy_trustpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plusbuy_trustpay_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/plusbuy_trustpay_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/plusbuy_trustpay_test?schema=public
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      APP_URL: http://localhost:3000
      TRUSTPAY_BASE_URL: http://localhost:3000
      TRUSTPAY_API_KEY: tp_test_ci_key
      TRUSTPAY_WEBHOOK_SECRET: whsec_ci_secret
      CRON_SECRET: cron_ci_secret
      AUTO_RELEASE_DAYS: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
